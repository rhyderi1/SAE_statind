default: &DEFAULT

  # general
  hf_token: ""  # set via HF_TOKEN env var in SLURM scripts
  scratch_dir: "/scratch/rhyderi1"

  # model
  model:
    name: "gemma-2-2b"
    dtype: "float32"

  # data collection (infer_z)
  data_collection:
    n_batches: 13
    batch_size: 32
    context_size: 128
    shard_size: 50000
    store_x: true
    store_z: true

  # SAE architecture sweep
  sae_sweep:
    layers: [12, 19]
    archs: [relu, topk, jumprelu, matryoshka]
    sparsity_levels: [20, 40, 80]

  # absorption membership
  absorption:
    arch: relu
    layer: 12
    sparsity: "20"
    concept_id: "first_letter_s"
    letter: "S"
    atom_k: 7983
    theta_fire: 1.0e-8
    tau: 0.025
    share_threshold: 0.4
    min_support: 2
    control_oversample: 50
    control_seed: 42

  # scatter / axis conventions (must match src/gram_scatter.py)
  plot:
    xlim: [-1.0, 1.0]
    ylim: [1.0e-2, 1.0e5]
